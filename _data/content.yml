launch:
  show: true
  heading: Kickstarter launch
  date: 2027-02-02
  note: Tuesday, February 2, 2027. Follow us on Facebook and we'll post the moment
    it goes live.
  live_text: Live now!
how:
  show: true
  heading: How it plays
  notes:
    - title: Buy property
      text: Four properties, max. Your portfolio is capped, so every purchase counts.
      color: yellow
    - title: Collect rent
      text: Rent rolls in every round. So does 10% interest on whatever you borrowed.
      color: pink
    - title: Survive Fortuna
      text: One card each round. An inheritance, or a lawsuit. A lucky break, or a
        storm.
      color: blue
    - title: Sabotage friends
      text: Make a rival draw Fortuna. When their luck turns bad, you collect.
      color: green
  win_title: The player with the most wealth wins.
  win_text: Hold more than 200 Rebucks with every loan paid off, and outmaneuver
    everyone at the table.
market:
  show: true
  kicker: Now listing
  heading: On the market
  intro: From tiny houses to castles. Pick the right listings and let the rent
    work for you.
  listings:
    - name: Tiny House
      image: /tinyhouse.webp
    - name: Mansion
      image: /mansion.webp
    - name: Lighthouse
      image: /lighthouse.webp
    - name: Castle
      image: /castle.webp
pocket:
  show: true
  kicker: Ad Valorem Pocket
  heading: Play it on your phone
  points:
    - One person hosts. Everyone else joins free with a room key.
    - No ads. Game night, not microtransactions.
    - Coming to iOS and Android. Try the web version today.
  button_label: Play the free demo
  room_key: ROOM SJ4-GT7
story:
  show: true
  heading: How it started
  paragraphs:
    - In 2017 I was training to become a Realtor, and some of the terms were
      hard to wrap my head around. So I started turning them into a game.
    - When I showed it to my wife, she thought it could be a real game someday.
      Years of playtesting with friends, family and even strangers later, here
      we are.
  signature: Matt, East Texas
footer:
  credit: Ad Valorem is a game by Matt Parker.
  demo_link_label: Free demo
  kickstarter_link_label: Kickstarter
